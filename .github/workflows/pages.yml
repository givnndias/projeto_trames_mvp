name: Publicar Trames

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Preparar a versão para GitHub Pages
        shell: bash
        run: |
          cat > vite.pages.config.ts <<'EOF'
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          import tailwindcss from '@tailwindcss/vite';
          import { fileURLToPath } from 'node:url';

          export default defineConfig({
            base: '/projeto_trames_mvp/',
            plugins: [react(), tailwindcss()],
            resolve: {
              alias: {
                '@': fileURLToPath(new URL('./src', import.meta.url))
              }
            },
            build: { outDir: 'dist-pages' }
          });
          EOF

          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
              <meta name="theme-color" content="#FF7A00" />
              <title>Trames — Seu caminho, suas prioridades</title>
              <link rel="icon" href="%BASE_URL%favicon.png" />
              <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/pages-entry.tsx"></script>
            </body>
          </html>
          EOF

          cat > src/pages-entry.tsx <<'EOF'
          import { createRoot } from 'react-dom/client';
          import {
            createHashHistory,
            RouterProvider
          } from '@tanstack/react-router';
          import { routeTree } from './routeTree.gen';
          import { getRouter } from './router';
          import './styles.css';

          routeTree.options.shellComponent =
            ({ children }) => <>{children}</>;

          const router = getRouter();
          router.update({ history: createHashHistory() });

          createRoot(document.getElementById('root')!).render(
            <RouterProvider router={router} />
          );
          EOF

      - name: Compilar o aplicativo
        run: |
          bunx vite build --config vite.pages.config.ts
          test -f dist-pages/index.html
          touch dist-pages/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar o aplicativo compilado
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v4
